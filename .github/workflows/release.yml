# Baut ReplayClip auf einem Windows-Server von GitHub und veröffentlicht ein Release,
# sobald auf main eine neue Versionsnummer (AssemblyVersion in src/Program.cs) ankommt,
# für die es noch kein Release gibt. Die App findet das Release dann als Update.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version lesen und prüfen, ob es schon ein Release gibt
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $m = Select-String -Path src/Program.cs -Pattern 'AssemblyVersion\("(\d+)\.(\d+)\.(\d+)'
          if (-not $m) { throw "AssemblyVersion nicht gefunden" }
          $g = $m.Matches[0].Groups
          $ver = "$($g[1].Value).$($g[2].Value).$($g[3].Value)"
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          gh release view "v$ver" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release v$ver existiert schon - nichts zu tun."
            "SKIP=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          $global:LASTEXITCODE = 0

      - name: Bauen
        if: env.SKIP != '1'
        shell: cmd
        run: call build.bat ci

      - name: Zip packen
        if: env.SKIP != '1'
        shell: pwsh
        run: |
          $top = "ReplayClip-$env:VERSION"
          New-Item -ItemType Directory $top | Out-Null
          Copy-Item ReplayClip.exe, LIESMICH.txt, build.bat, "ReplayClip starten.bat", CHANGELOG.md -Destination $top
          Copy-Item src -Destination "$top/src" -Recurse
          Compress-Archive -Path $top -DestinationPath "$top.zip"

      - name: Release-Notizen aus CHANGELOG.md
        if: env.SKIP != '1'
        shell: pwsh
        run: |
          $out = @(); $in = $false
          foreach ($l in Get-Content CHANGELOG.md -Encoding UTF8) {
            if ($l -match '^## ') {
              if ($in) { break }
              if ($l -match ('^## \[?v?' + [regex]::Escape($env:VERSION) + '\b')) { $in = $true }
              continue
            }
            if ($in) { $out += $l }
          }
          if ($out.Count -eq 0) { $out = @("ReplayClip $env:VERSION") }
          $out | Set-Content notes.md -Encoding utf8

      - name: Release veröffentlichen (legt auch den Tag an)
        if: env.SKIP != '1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$env:VERSION" "ReplayClip-$env:VERSION.zip" --target "${{ github.sha }}" --title "ReplayClip $env:VERSION" --notes-file notes.md
